# Story configuration. Fill this in when starting a new project.
# The framework reads this to know what kind of story it's working with.

title: "Untitled"
genre: "literary-sf"          # affects rubric selection, lexicon tuning
status: drafting              # drafting | content-complete

target_word_count: 10000      # minimum floor
max_word_count: 50000         # hard ceiling

# Ordered chapter files (relative to src/04-chapters/)
chapters: []

# --- Rubric customization ---
# Core criteria 1-30 are universal. Criteria 31-50 are genre slots.
# Replace the descriptions below with your genre-specific standards.

genre_criteria:
  - id: 31
    name: "Genre contract — delivering the label's promise"
    description: "Whatever the work claims to be, it delivers at competitive quality."
  - id: 32
    name: "World-building integration"
    description: "Every world element is load-bearing; nothing exists purely for tour-guide wonder."
  - id: 33
    name: "Defamiliarization with purpose"
    description: "The strange element reframes the familiar rather than decorating it."

# --- Motif tracking ---
# Add the recurring images/ideas specific to your story.
motifs: []

# --- Emotion lexicons ---
# Tune for your story's emotional palette. These feed the atmosphere panel.
emotion_lexicons:
  fear_dread: [afraid, fear, dread, terror, tremble, warning, danger, refusal]
  grief: [grief, lost, loss, gone, absent, ache, hollow, wound, weep, mourn]
  joy_warmth: [laugh, smile, grin, joy, delight, glad, gentle, comfort, love]
  anger: [angry, fury, rage, bitter, snap, harsh, furious]
  awe_wonder: [wonder, marvel, vast, impossible, strange, awe]
